<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intersection Counter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --accent: #0d9488;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --surface: #f8fafc;
      --error: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #map { height: 100vh; width: 100vw; }

    /* Slight softening of map tiles so the UI pops */
    .leaflet-tile-pane { filter: saturate(0.9) contrast(0.96); }

    #panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      padding: 22px;
      border-radius: 16px;
      box-shadow:
        0 10px 32px rgba(15, 23, 42, 0.12),
        0 2px 6px rgba(15, 23, 42, 0.06),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      width: 288px;
    }

    #panel h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -0.01em;
    }

    #panel h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    #panel p.hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    #status {
      font-size: 0.82rem;
      color: var(--text-muted);
      min-height: 22px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    #result {
      display: none;
      margin-top: 12px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .metric:last-child { margin-bottom: 0; }

    .metric .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric .value {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .metric.primary .value { color: var(--primary-dark); }
    .metric.accent  .value { color: var(--accent); }

    .metric .sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 7px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: var(--error); font-weight: 500; }

    /* Credit bar */
    .credits {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.92);
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .credits a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .credits a:hover { text-decoration: underline; }

    /* Polish the Leaflet.draw toolbar a bit */
    .leaflet-draw-toolbar a {
      border-radius: 6px !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="credits">
    OSM data © <a href="https://www.openstreetmap.org/copyright">contributors</a>
    · <a href="backbone.html">street backbone</a>
  </div>

  <div id="panel">
    <h2>Intersection Counter</h2>
    <p class="hint">Use the rectangle or polygon tool (top-left of map) to draw an area. Road intersections inside will be counted.</p>
    <div id="status">Waiting for selection...</div>
    <div id="result">
      <div class="label">Intersections found</div>
      <div class="count" id="count">—</div>
      <div class="sub" id="sub"></div>
      <div class="label" style="margin-top:14px">Density</div>
      <div class="count" id="density" style="font-size:1.6rem;color:#0f766e">—</div>
      <div class="sub" id="area"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script>
    // Default view: Tel Aviv
    const map = L.map('map').setView([32.08, 34.78], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer to hold drawn shapes
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // Draw control — rectangle + polygon
    const shapeOptions = { color: '#1a56db', weight: 2 };
    const drawControl = new L.Control.Draw({
      draw: {
        rectangle: { shapeOptions },
        polygon:   { shapeOptions, allowIntersection: false, showArea: false },
        polyline: false,
        circle: false,
        circlemarker: false,
        marker: false
      },
      edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    // Rate limit: minimum 3 seconds between queries to respect Overpass fair use
    let lastQueryTime = 0;
    const MIN_INTERVAL_MS = 3000;
    const MAX_AREA_KM2 = 25;

    // Extract outer ring of latlngs from a Leaflet rectangle or polygon
    function latLngsOf(layer) {
      const raw = layer.getLatLngs();
      return Array.isArray(raw[0]) ? raw[0] : raw;
    }

    function runCount(latlngs) {
      const statusEl = document.getElementById('status');
      const area = polygonAreaKm2(latlngs);

      if (area > MAX_AREA_KM2) {
        statusEl.innerHTML = `<span class="error">&#9888; Area too large (${area.toFixed(1)} km²). Max ${MAX_AREA_KM2} km² — try a smaller area.</span>`;
        document.getElementById('result').style.display = 'none';
        return;
      }

      const now = Date.now();
      const wait = Math.max(0, lastQueryTime + MIN_INTERVAL_MS - now);
      lastQueryTime = now + wait;
      if (wait > 0) {
        statusEl.textContent = `Rate-limiting... waiting ${(wait / 1000).toFixed(1)}s`;
        setTimeout(() => countIntersections(latlngs, area), wait);
      } else {
        countIntersections(latlngs, area);
      }
    }

    map.on(L.Draw.Event.CREATED, (e) => {
      drawnItems.clearLayers();
      drawnItems.addLayer(e.layer);
      runCount(latLngsOf(e.layer));
    });

    map.on(L.Draw.Event.EDITED, (e) => {
      e.layers.eachLayer((layer) => runCount(latLngsOf(layer)));
    });

    // Geodesic polygon area in km² using spherical excess (Green's theorem on a sphere)
    function polygonAreaKm2(latlngs) {
      if (!latlngs || latlngs.length < 3) return 0;
      const R = 6371; // Earth radius in km
      const toRad = d => d * Math.PI / 180;
      let area = 0;
      for (let i = 0; i < latlngs.length; i++) {
        const p1 = latlngs[i];
        const p2 = latlngs[(i + 1) % latlngs.length];
        area += toRad(p2.lng - p1.lng) *
                (2 + Math.sin(toRad(p1.lat)) + Math.sin(toRad(p2.lat)));
      }
      return Math.abs(area * R * R / 2);
    }

    const OVERPASS_ENDPOINTS = [
      'https://z.overpass-api.de/api/interpreter',
      'https://overpass-api.de/api/interpreter',
    ];

    function xhrGet(url) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url);
        xhr.timeout = 30000;
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); }
            catch (e) { reject(new Error('Invalid JSON')); }
          } else {
            reject(new Error(`HTTP ${xhr.status}`));
          }
        };
        xhr.onerror   = () => reject(new Error('Network error (XHR)'));
        xhr.ontimeout = () => reject(new Error('Timeout (XHR)'));
        xhr.send();
      });
    }

    async function fetchOverpass(query, logEl) {
      const log = (msg) => { logEl.textContent = msg; console.log(msg); };
      const errors = [];

      for (const endpoint of OVERPASS_ENDPOINTS) {
        const url = endpoint + '?data=' + encodeURIComponent(query);
        log(`Trying ${endpoint}...`);
        // Try fetch first
        try {
          const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } catch (err) {
          errors.push(`fetch ${endpoint}: ${err.message}`);
          console.warn(err.message);
        }
        // Try XHR fallback
        try {
          return await xhrGet(url);
        } catch (err) {
          errors.push(`xhr ${endpoint}: ${err.message}`);
          console.warn(err.message);
        }
      }

      // Last resort: CORS proxy
      log('Trying CORS proxy...');
      try {
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(
          OVERPASS_ENDPOINTS[0] + '?data=' + encodeURIComponent(query)
        );
        const response = await fetch(proxyUrl, { signal: AbortSignal.timeout(30000) });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (err) {
        errors.push(`corsproxy: ${err.message}`);
      }

      throw new Error('All attempts failed:\n' + errors.join('\n'));
    }

    async function countIntersections(latlngs, areaKm2) {
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const countEl  = document.getElementById('count');
      const subEl    = document.getElementById('sub');

      resultEl.style.display = 'none';
      statusEl.innerHTML = '<span class="spinner"></span>Connecting...';

      // Build poly filter for Overpass: "lat1 lng1 lat2 lng2 ..."
      const polyStr = latlngs
        .map(p => `${p.lat.toFixed(6)} ${p.lng.toFixed(6)}`)
        .join(' ');

      // Query road ways inside the polygon (excludes footways, steps, etc.)
      const query = `[out:json][timeout:30];way[highway][highway!~"footway|cycleway|path|steps|service|track|proposed|construction"](poly:"${polyStr}");out body;`;

      try {
        const data = await fetchOverpass(query, statusEl);

        // Count how many ways each node appears in
        const nodeCount = {};
        let wayCount = 0;
        for (const el of data.elements) {
          if (el.type === 'way' && el.nodes) {
            wayCount++;
            for (const nodeId of el.nodes) {
              nodeCount[nodeId] = (nodeCount[nodeId] || 0) + 1;
            }
          }
        }

        // A node shared by 2+ ways is an intersection
        const intersections = Object.values(nodeCount).filter(c => c >= 2).length;
        const density = intersections / areaKm2;

        statusEl.textContent = 'Done.';
        countEl.textContent  = intersections.toLocaleString();
        subEl.textContent    = `across ${wayCount.toLocaleString()} road segments`;

        document.getElementById('density').textContent = density.toFixed(1) + ' / km²';
        document.getElementById('area').textContent    = `area: ${areaKm2.toFixed(3)} km²`;

        resultEl.style.display = 'block';

      } catch (err) {
        statusEl.innerHTML = `<span class="error">&#9888; ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
